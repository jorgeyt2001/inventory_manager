workflows:
  ios-unsigned:
    name: iOS IPA sin firma
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS sin codesign
        script: flutter build ios --release --no-codesign
      - name: Crear IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../inventory_manager.ipa Payload/
    artifacts:
      - build/inventory_manager.ipa
